name = "weibian-content"
main = "src/index.js"
compatibility_date = "2026-07-01"

# App 里写死的内容接口地址是 weibian.bdfz.net，
# 自定义域必须随部署一起声明，否则只有 workers.dev 可用。
routes = [
  { pattern = "weibian.bdfz.net", custom_domain = true },
]

# 当前 manifest 与旧客户端兼容 bundle 随部署发布；已审核的不可变完整包
# 存在 R2，并由代码 exact allowlist 映射。回滚 Worker 不删除 R2 对象。
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "weibian-rankings"
database_id = "cfaf4257-b93a-4a24-b186-b221e1895331"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CONTENT_R2"
bucket_name = "blog-images"

[[services]]
binding = "USER_CENTER"
service = "bdfz-user-center"

[observability]
enabled = true
