name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Bootstrap locked public content
        run: node scripts/bootstrap_public_content.mjs
      - name: Verify Worker logic
        run: node --test worker/test/*.test.mjs
      - name: Verify Android release guard
        run: node --test scripts/test/*.test.mjs
      - name: Test, lint and build Android
        run: ./gradlew :app:testDirectDebugUnitTest :app:lintDirectDebug :app:assembleDirectDebug
